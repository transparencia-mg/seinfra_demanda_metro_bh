name: CKAN

on:
  # Rodar à mão (aba Actions > CKAN > Run workflow), com o código atual da main
  workflow_dispatch:
  push:
    paths:
      - 'dataset/**'
      - 'upload/**'

# Uma execução por vez: dois pushes seguidos rodavam em paralelo e o segundo falhava no push
# dos commits automáticos (24/11/2026). A nova espera a anterior terminar.
concurrency:
  group: publish-dataset
  cancel-in-progress: false

jobs:
  publish_update:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'    
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip uninstall numpy -y
          pip install numpy==1.23.5 --no-cache-dir
          pip install -r requirements.txt
      - name: Convert CSV
        run: task csv
      - name: Commit CSV
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Converte Excel para CSV (e remove CSVs de Excel excluído) via script.
      - name: Create datapackage.yaml
        env:
          DATASET_NAME: ${{ github.event.repository.name }}
          OWNER_ORG: ${{ secrets.OWNER_ORG }}
        run: task yaml
      - name: Commit new datapackage.yaml
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Cria/sincroniza recursos do datapackage.yaml via script.
      - name: Create datapackage.json
        run: task json
      - name: Commit new datapackage.json
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Cria datapackage.json via script.
      # - name: Create dynamic documentation
      #   run: task documentation
      # - name: Commit markdown files
      #   uses: stefanzweifel/git-auto-commit-action@v4
      #   with:
      #     commit_message: Cria arquivos markdown via script.
      - name: Local dataset validation
        run: task validate
      - name: Commit new datapackage_validation.json
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Cria datapackage_validation.json via script.
      - name: Create Report
        continue-on-error: true
        run: task report
      - name: Commit new index.html report file.
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Cria arquivo index.html de validação.
        # - name: Frictionless validation
        #   continue-on-error: true
        #   uses: frictionlessdata/repository@v2
      - id: string
        uses: ASzc/change-string-case-action@v1
        with:
          string: ${{ github.actor }}
      - name: Create dataset in CKAN with not exist
        continue-on-error: true
        env:
          CKAN_HOST: ${{ secrets.CKAN_HOST }}
          CKAN_KEY: ${{ secrets[format('CKAN_KEY_{0}', steps.string.outputs.uppercase)] }}
        run: dpckan --datastore --datapackage dataset/datapackage.json --ckan-host "$CKAN_HOST" --ckan-key "$CKAN_KEY" dataset create
      - name: Sync resources in CKAN (cria novos e exclui removidos)
        if: ${{ ! cancelled() }}
        env:
          CKAN_HOST: ${{ secrets.CKAN_HOST }}
          CKAN_KEY: ${{ secrets[format('CKAN_KEY_{0}', steps.string.outputs.uppercase)] }}
        run: task sync
      # Só os recursos que mudaram (scripts/ckan_update_changed.py). O `dpckan dataset update`
      # reenviava todos (o dataset não tem licença aberta): 4 h para mudar uma linha (26/11/2026).
      # Um mês novo leva ~25 min no CKAN; o limite evita ficar preso até as 6 h da Action.
      - name: Update dataset in CKAN (só o que mudou)
        if: ${{ ! cancelled() }}
        timeout-minutes: 120
        env:
          CKAN_HOST: ${{ secrets.CKAN_HOST }}
          CKAN_KEY: ${{ secrets[format('CKAN_KEY_{0}', steps.string.outputs.uppercase)] }}
        run: task update
